<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор Сумма Фортуны</title>
    <style>
        body {
            background: radial-gradient(circle at center, #3a0505 0%, #150000 80%, #000000 100%);
            color: #e0e0e0;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 10px;
            height: 100vh;
            overflow: hidden;
            box-sizing: border-box;
        }
        .sp {
            background: linear-gradient(180deg, #1a0808 0%, #120404 100%);
            border: 2px solid #8a6a2a;
            border-radius: 12px;
            height: 100%;
            display: grid;
            grid-template-rows: auto 1fr auto;
            box-shadow: 0 0 60px rgba(212, 175, 55, 0.15);
            overflow: hidden;
        }
        .sh {
            background: linear-gradient(90deg, #2a0a0a 0%, #1a0505 50%, #2a0a0a 100%);
            padding: 12px 25px 16px 25px;
            border-bottom: 2px solid #8a6a2a;
            text-align: center;
            position: relative;
        }
        .sh::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 8px;
            background: #d4af37;
            border-radius: 10px;
            box-shadow: 0 0 10px #d4af37;
        }
        .sh h2 {
            color: #d4af37;
            font-family: 'Georgia', serif;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 6px;
            margin: 0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8), 0 0 15px rgba(212, 175, 55, 0.3);
        }
        .sh-sub {
            color: #8a6a5a;
            font-size: 14px;
            margin-top: 6px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .sh-sub-val {
            color: #e0e0e0;
            font-weight: 800;
            font-size: 16px;
        }

        .sb {
            display: grid;
            grid-template-columns: 360px 1fr; 
            gap: 20px;
            padding: 15px 20px;
            overflow: hidden;
        }

        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            padding-right: 10px;
        }
        .left-panel::-webkit-scrollbar { width: 6px; }
        .left-panel::-webkit-scrollbar-track { background: #1a0808; border-radius: 3px; }
        .left-panel::-webkit-scrollbar-thumb { background: #8a6a2a; border-radius: 3px; }

        .ss { margin-bottom: 0; }
        .ss h3 {
            color: #d4af37;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid #3a1a0a;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sr { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
        .sr label { color: #a09080; font-size: 12px; min-width: 140px; }
        .sr input {
            background: #0d0404; border: 1px solid #4a1a0a; color: #f5c518; font-size: 14px; padding: 6px 10px; border-radius: 6px; width: 100%; font-weight: 700; outline: 0; box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
        }
        .sr input:focus { border-color: #d4af37; }
        
        /* Вкладки слоев */
        .ltabs { display: flex; gap: 4px; flex-wrap: wrap; }
        .ltab {
            display: flex; align-items: center; gap: 4px;
            background: #2a0808; border: 1px solid #4a1a0a; color: #aaa; padding: 5px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 700; user-select: none; transition: 0.2s;
        }
        .ltab:hover { color: #d4af37; border-color: #d4af37; }
        .ltab.active { background: #d4af37; color: #1a0505; border-color: #d4af37; }
        
        /* Крестик удаления слоя */
        .ltab-close {
            color: #555; font-size: 12px; line-height: 1; padding: 0 2px; border-radius: 2px; transition: 0.2s;
        }
        .ltab-close:hover { color: #ff4444; }
        .ltab.active .ltab-close { color: #1a0505; opacity: 0.5; }
        .ltab.active .ltab-close:hover { color: #ff0000; opacity: 1; }
        
        /* Скрываем крестик, если слой всего один */
        .ltab-single .ltab-close { display: none; }

        .ltab-add { color: #666; border-style: dashed; font-weight: 800; }
        .ltab-add:hover { color: #f5c518; border-color: #f5c518; }

        .cg { display: grid; grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); gap: 3px; }
        .cc { background: #1f0a05; border: 1px solid #3a1508; border-radius: 4px; padding: 3px 2px; text-align: center; }
        .cc .n { color: #ddd; font-weight: 800; font-size: 12px; }
        .cc .v { font-weight: 800; font-size: 9px; margin-top: 1px; }
        
        .ng { display: grid; grid-template-columns: repeat(9, 1fr); gap: 5px; margin-bottom: 8px; }
        .nb {
            background: #2a0808; border: 1px solid #4a1a0a; color: #bbb; padding: 10px 2px; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: 800; text-align: center; transition: 0.2s; user-select: none;
        }
        .nb:hover { border-color: #d4af37; color: #d4af37; }
        .nb.on { background: linear-gradient(180deg, #f5c518, #d4af37); color: #1a0505; border-color: #fff; box-shadow: 0 0 10px rgba(245, 197, 24, 0.4); }

        .ti { color: #8a7a6a; font-size: 12px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
        .ti b { color: #f5c518; }
        .clr { background: 0 0; border: 0; color: #8a6a5a; font-size: 11px; cursor: pointer; text-decoration: underline; padding: 0; }
        .clr:hover { color: #d4af37; }
        .ab {
            background: linear-gradient(180deg, #f5c518, #b8860b); color: #1a0505; border: 0; padding: 8px 15px; border-radius: 6px; font-size: 13px; font-weight: 800; cursor: pointer; transition: 0.3s; letter-spacing: 1px; text-transform: uppercase; width: 100%;
        }
        .ab:hover { box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4); }

        .tci { background: #1f0a05; border: 1px solid #3a1508; border-radius: 8px; padding: 10px; margin-bottom: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .tci-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .tci-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .tci .tn { color: #f5c518; font-weight: 800; font-size: 13px; }
        .tci .tc { color: #8a6a5a; font-size: 11px; }
        .td { background: #3a0a0a; border: 1px solid #5a1a0a; color: #ff5555; width: 24px; height: 24px; border-radius: 4px; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; transition: 0.2s; flex-shrink: 0; }
        .td:hover { background: #ff5555; color: #fff; }

        .qg { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; padding-top: 8px; border-top: 1px dashed #3a1508; }
        .qi-wrap { display: flex; flex-direction: column; align-items: center; }
        .qi-label { font-size: 8px; color: #6a4a3a; margin-bottom: 2px; font-weight: 700; }
        .qi { background: #0d0404; border: 1px solid #3a1508; color: #f5c518; font-size: 11px; padding: 5px 2px; width: 100%; text-align: center; border-radius: 3px; outline: 0; font-weight: 700; -moz-appearance: textfield; box-shadow: inset 0 1px 2px rgba(0,0,0,0.5); }
        .qi::-webkit-inner-spin-button, .qi::-webkit-outer-spin-button { -webkit-appearance: none; }
        .qi:focus { border-color: #d4af37; background: #1a0a05; }

        .right-panel {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .dg { 
            display: grid; 
            grid-template-columns: repeat(6, 1fr); 
            grid-template-rows: repeat(4, 1fr);
            gap: 6px; 
            height: 100%;
        }
        .di { background: #1a0808; border: 1px solid #3a1508; border-radius: 8px; padding: 6px; display: flex; align-items: center; gap: 4px; transition: 0.3s; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .di.win { border-color: #d4af37; background: #2a1a05; box-shadow: 0 0 20px rgba(212, 175, 55, 0.2); }
        .di.miss { border-color: #5a2020; }
        .dn { color: #6a4a3a; font-size: 11px; font-weight: 800; min-width: 22px; font-style: italic; }
        .di input { background: #0d0404; border: 1px solid #4a1a0a; color: #fff; font-size: 15px; padding: 5px; border-radius: 4px; width: 36px; text-align: center; outline: 0; font-weight: 800; -moz-appearance: textfield; box-shadow: inset 0 1px 3px rgba(0,0,0,0.5); }
        .di input::-webkit-inner-spin-button, .di input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .di input:focus { border-color: #d4af37; }
        .dr { font-size: 9px; flex: 1; text-align: right; line-height: 1.2; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        /* УВЕЛИЧЕННЫЙ ШРИФТ ВЫИГРЫША */
        .dr.w { color: #f5c518; font-weight: 900; text-shadow: 0 0 10px rgba(245, 197, 24, 0.7); font-size: 16px; }
        
        .dr.m { color: #cc4444; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;}

        .sf { 
            background: linear-gradient(180deg, #1f0a05, #140606); 
            border-top: 2px solid #8a6a2a; 
            padding: 12px 25px; 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 20px; 
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }
        .tpl { color: #8a6a5a; font-size: 10px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 3px; font-weight: 700; }
        .tpv { font-size: 22px; font-weight: 900; font-family: 'Georgia', serif; }
        .tpc .tpv { color: #ff4444; text-shadow: 0 0 10px rgba(255, 68, 68, 0.3); }
        .tpw .tpv { color: #f5c518; text-shadow: 0 0 15px rgba(245, 197, 24, 0.4); }
        .tpp .tpv { color: #ffffff; text-shadow: 0 0 10px rgba(255, 255, 255, 0.3); }
        .tpp .tpv.neg { color: #ff4444; text-shadow: 0 0 10px rgba(255, 68, 68, 0.3); }
        
        .rb { background: #2a0808; border: 1px solid #5a1a0a; color: #8a6a5a; padding: 4px 10px; border-radius: 4px; font-size: 9px; cursor: pointer; transition: 0.2s; font-weight: 700; text-transform: uppercase; }
        .rb:hover { border-color: #ff4444; color: #ff4444; background: #3a0a0a; }
    </style>
</head>
<body>

<div class="sp">
    <div class="sh">
        <h2>СУММА ФОРТУНЫ</h2>
        <div class="sh-sub">Сумма выпавших чисел: <span class="sh-sub-val" id="sum-nums">0</span></div>
    </div>
    
    <div class="sb">
        <!-- ЛЕВАЯ ПАНЕЛЬ -->
        <div class="left-panel">
            <div class="ss">
                <h3>Настройки</h3>
                <div class="sr">
                    <label>Цена цифры, ₽</label>
                    <input type="number" id="sfp" value="550" min="1">
                </div>
                <div class="sr">
                    <label>Скидка, %</label>
                    <input type="number" id="sfd" value="0" min="0" max="100">
                </div>
                <div class="sr">
                    <label>Мин. выигрыш, ₽</label>
                    <input type="number" id="sfm" value="550" min="1">
                </div>
            </div>

            <div class="ss">
                <h3>Слои комбинаций</h3>
                <div class="ltabs" id="ltabs"></div>
            </div>

            <div class="ss">
                <h3>Коэффициенты</h3>
                <div class="cg" id="sfcg"></div>
            </div>

            <div class="ss">
                <h3>Создание билета</h3>
                <div class="ng" id="sfng"></div>
                <div class="ti">
                    Выбрано: <b id="sfsc">0</b> | 
                    <b id="sfscc">0 ₽</b> 
                    <button class="clr" id="sfcl">Сброс</button>
                </div>
                <button class="ab" id="sfa">Добавить билет</button>
            </div>

            <div class="ss" id="sfts" style="display:none">
                <h3>Ставки (<span id="sftc">0</span>) <button class="rb" id="sftd" style="margin-left:auto">Удалить все</button></h3>
                <div id="sftl"></div>
            </div>
        </div>

        <!-- ПРАВАЯ ПАНЕЛЬ (ТИРАЖИ) -->
        <div class="right-panel">
            <div class="ss" style="margin-bottom: 0; height: 100%; display: flex; flex-direction: column;">
                <h3>Тиражи (24) <button class="rb" id="sfrd" style="margin:0 0 0 10px;vertical-align:middle">Сбросить</button></h3>
                <div class="dg" id="sfdg"></div>
            </div>
        </div>
    </div>

    <!-- ПОДВАЛ (ИТОГИ) -->
    <div class="sf">
        <div class="tpc"><div class="tpl">Затраты</div><div class="tpv" id="stc">0 ₽</div></div>
        <div class="tpw"><div class="tpl">Выигрыш</div><div class="tpv" id="stw">0 ₽</div></div>
        <div class="tpp"><div class="tpl">Прибыль</div><div class="tpv" id="stp">0 ₽</div></div>
    </div>
</div>

<script>
    const CF = {
        6:8000, 7:6000, 8:4000, 9:250, 10:140, 11:70, 12:55, 13:30, 14:24, 15:18, 16:12,
        17:10, 18:9, 19:8, 20:7, 21:7, 22:7, 23:8, 24:9, 25:10, 26:12, 27:18, 28:24,
        29:30, 30:55, 31:70, 32:140, 33:250, 34:4000, 35:6000, 36:8000
    };

    // СИСТЕМА СЛОЕВ
    let layers = [{ id: 1, name: 'Слой 1', tickets: [] }];
    let activeLayerId = 1;
    let layerCounter = 1;

    function getActiveLayer() { return layers.find(l => l.id === activeLayerId); }

    let sn = new Set(); 

    function fm(n) { return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
    function fc(v) { return v >= 1000 ? (v/1000)+'К' : ''+v; }

    function getBaseCost(numCount) {
        let p = parseInt(document.getElementById('sfp').value) || 0;
        let d = parseInt(document.getElementById('sfd').value) || 0;
        d = Math.min(100, Math.max(0, d)); 
        return numCount * p * (1 - d / 100);
    }

    // ЛОГИКА ВКЛАДОК СЛОЕВ (С КРЕСТИКАМИ)
    function renderTabs() {
        const cont = document.getElementById('ltabs');
        cont.innerHTML = '';
        layers.forEach(l => {
            let t = document.createElement('div');
            // Добавляем класс ltab-single если слой всего 1 (чтобы скрыть крестик CSS-ом)
            t.className = 'ltab' + (l.id === activeLayerId ? ' active' : '') + (layers.length === 1 ? ' ltab-single' : '');
            
            let span = document.createElement('span');
            span.textContent = l.name;
            
            let closeBtn = document.createElement('div');
            closeBtn.className = 'ltab-close';
            closeBtn.textContent = '×';
            
            // При клике на саму вкладку - переключаемся
            t.onclick = (e) => {
                // Если кликнули именно по крестику, не переключаем слой
                if (e.target.classList.contains('ltab-close')) return;
                switchLayer(l.id);
            };

            // При клике на крестик - удаляем
            closeBtn.onclick = (e) => {
                e.stopPropagation(); // Останавливаем всплытие, чтобы не сработал клик по вкладке
                deleteLayer(l.id);
            };

            t.appendChild(span);
            t.appendChild(closeBtn);
            cont.appendChild(t);
        });
        
        let addBtn = document.createElement('div');
        addBtn.className = 'ltab ltab-add';
        addBtn.textContent = '+ Слой';
        addBtn.onclick = addLayer;
        cont.appendChild(addBtn);
    }

    function switchLayer(id) {
        activeLayerId = id;
        renderTabs();
        renderTk();
        fullRecalc();
    }

    function addLayer() {
        layerCounter++;
        layers.push({ id: layerCounter, name: 'Слой ' + layerCounter, tickets: [] });
        switchLayer(layerCounter);
    }

    function deleteLayer(id) {
        // Защита: нельзя удалить последний слой
        if (layers.length <= 1) return; 
        
        const index = layers.findIndex(l => l.id === id);
        if (index === -1) return;

        // Удаляем слой из массива
        layers.splice(index, 1);

        // Если удалили активный слой, переключаемся на первый доступный
        if (activeLayerId === id) {
            activeLayerId = layers[0].id;
        }

        // Перерисовываем интерфейс
        renderTabs();
        renderTk();
        fullRecalc();
    }

    // ИНИЦИАЛИЗАЦИЯ СПРАВОЧНИКА
    const cg = document.getElementById('sfcg');
    for(let i=6; i<=36; i++) {
        let c = document.createElement('div'); c.className='cc';
        let v = CF[i];
        let cl = v >= 4000 ? '#f5c518' : v >= 100 ? '#c8920a' : '#6a5a4a';
        c.innerHTML = `<div class="n">${i}</div><div class="v" style="color:${cl}">×${fc(v)}</div>`;
        cg.appendChild(c);
    }

    // ВЫБОР ЧИСЕЛ
    const ng = document.getElementById('sfng');
    for(let i=6; i<=36; i++) {
        (function(n) {
            let b = document.createElement('div'); b.className='nb'; b.textContent=n;
            b.onclick = function() {
                if(sn.has(n)) { sn.delete(n); b.classList.remove('on'); }
                else { sn.add(n); b.classList.add('on'); }
                document.getElementById('sfsc').textContent = sn.size;
                document.getElementById('sfscc').textContent = fm(getBaseCost(sn.size)) + ' ₽';
            };
            ng.appendChild(b);
        })(i);
    }

    // ГЕНЕРАЦИЯ ТИРАЖЕЙ
    const dg = document.getElementById('sfdg');
    for(let i=1; i<=24; i++) {
        (function(idx) {
            let d = document.createElement('div'); d.className='di'; d.id='sfd'+idx;
            d.innerHTML = `<div class="dn">T${idx}</div><input type="number" min="6" max="36" id="sfi${idx}"><div class="dr" id="sfr${idx}"></div>`;
            dg.appendChild(d);
            document.getElementById('sfi'+idx).addEventListener('input', function() {
                let val = parseInt(this.value);
                if(val >= 6 && val <= 36 && idx < 24) document.getElementById('sfi'+(idx+1)).focus();
                calcDraw(idx);
                recalc();
            });
        })(i);
    }

    // ДОБАВИТЬ БИЛЕТ
    document.getElementById('sfa').onclick = function() {
        if(!sn.size) return;
        let nums = Array.from(sn).sort((a,b) => a-b);
        let cost = getBaseCost(nums.length);
        getActiveLayer().tickets.push({ nums: nums, cost: cost, qty: new Array(24).fill(0) });
        
        sn.clear();
        ng.querySelectorAll('.nb').forEach(b => b.classList.remove('on'));
        document.getElementById('sfsc').textContent = '0';
        document.getElementById('sfscc').textContent = '0 ₽';
        
        renderTk();
        fullRecalc();
    };

    document.getElementById('sfcl').onclick = function() {
        sn.clear(); ng.querySelectorAll('.nb').forEach(b => b.classList.remove('on'));
        document.getElementById('sfsc').textContent = '0'; document.getElementById('sfscc').textContent = '0 ₽';
    };

    document.getElementById('sftd').onclick = function() { 
        getActiveLayer().tickets = []; 
        renderTk(); 
        fullRecalc(); 
    };

    document.getElementById('sfrd').onclick = function() {
        for(let i=1; i<=24; i++) {
            document.getElementById('sfi'+i).value = ''; document.getElementById('sfr'+i).textContent = ''; document.getElementById('sfr'+i).className = 'dr';
            let d = document.getElementById('sfd'+i); d.classList.remove('win', 'miss');
        }
        updateSumOfNums(); 
        recalc();
    };

    function updateTicketCosts() { 
        let cost = getBaseCost(1); 
        layers.forEach(l => { l.tickets.forEach(t => { t.cost = t.nums.length * cost; }); });
    }
    
    function updateSumOfNums() {
        let sum = 0;
        for(let i=1; i<=24; i++) {
            let v = parseInt(document.getElementById('sfi'+i).value);
            if(!isNaN(v) && v >= 6 && v <= 36) sum += v;
        }
        document.getElementById('sum-nums').textContent = sum;
    }

    function fullRecalc() {
        for(let i=1; i<=24; i++) {
            let val = parseInt(document.getElementById('sfi'+i).value);
            if(!isNaN(val) && val >= 6 && val <= 36) calcDraw(i);
        }
        updateSumOfNums();
        recalc();
    }

    document.getElementById('sfp').addEventListener('input', function() {
        document.getElementById('sfscc').textContent = fm(getBaseCost(sn.size)) + ' ₽';
        updateTicketCosts(); renderTk(); fullRecalc(); 
    });

    document.getElementById('sfd').addEventListener('input', function() {
        document.getElementById('sfscc').textContent = fm(getBaseCost(sn.size)) + ' ₽';
        updateTicketCosts(); renderTk(); fullRecalc(); 
    });

    document.getElementById('sfm').addEventListener('input', function() { fullRecalc(); });

    // ОТРИСОВКА БИЛЕТОВ
    function renderTk() {
        let sec = document.getElementById('sfts'), list = document.getElementById('sftl');
        let currentTickets = getActiveLayer().tickets;
        
        document.getElementById('sftc').textContent = currentTickets.length;
        if(!currentTickets.length) { sec.style.display='none'; return; }
        sec.style.display = '';
        list.innerHTML = '';
        
        currentTickets.forEach((t, i) => {
            let d = document.createElement('div'); d.className='tci';
            let top = document.createElement('div'); top.className='tci-top';
            top.innerHTML = `
                <div class="tci-left">
                    <span class="tn">${t.nums.join(', ')}</span>
                    <span class="tc">${fm(t.cost)} ₽</span>
                </div>
                <button class="td" data-i="${i}">×</button>
            `;
            d.appendChild(top);

            let qg = document.createElement('div'); qg.className='qg';
            for(let j=1; j<=24; j++) {
                (function(idx) {
                    let wrap = document.createElement('div'); wrap.className='qi-wrap';
                    let label = document.createElement('div'); label.className='qi-label'; label.textContent='T'+idx;
                    let input = document.createElement('input'); input.className='qi'; input.type='number'; input.min='0'; input.value=t.qty[idx-1];
                    
                    input.addEventListener('input', function() {
                        t.qty[idx-1] = Math.max(0, parseInt(this.value) || 0);
                        calcDraw(idx);
                        recalc();
                    });

                    wrap.appendChild(label);
                    wrap.appendChild(input);
                    qg.appendChild(wrap);
                })(j);
            }
            d.appendChild(qg);
            list.appendChild(d);
        });

        list.querySelectorAll('.td').forEach(b => {
            b.onclick = function() { 
                getActiveLayer().tickets.splice(parseInt(this.dataset.i), 1); 
                renderTk(); fullRecalc(); 
            };
        });
    }

    // РАСЧЕТ ТИРАЖА
    function calcDraw(idx) {
        let inp = document.getElementById('sfi'+idx);
        let res = document.getElementById('sfr'+idx);
        let wrap = document.getElementById('sfd'+idx);
        let val = parseInt(inp.value);

        if(isNaN(val) || val < 6 || val > 36) {
            res.textContent = ''; res.className = 'dr';
            wrap.classList.remove('win', 'miss');
            return; 
        }

        let mw = parseInt(document.getElementById('sfm').value) || 550;
        let c = CF[val];
        let tw = 0, mc = 0; 
        let currentTickets = getActiveLayer().tickets;

        currentTickets.forEach(t => {
            let q = t.qty[idx-1]; 
            if(q > 0) {
                if(t.nums.indexOf(val) !== -1) {
                    tw += mw * c * q; 
                    mc += q;
                }
            }
        });

        if(mc > 0) {
            res.textContent = `${mc} шт → ${fm(tw)} ₽`;
            res.className = 'dr w';
            wrap.classList.add('win'); wrap.classList.remove('miss');
        } else {
            res.textContent = 'Мимо';
            res.className = 'dr m';
            wrap.classList.add('miss'); wrap.classList.remove('win');
        }
        
        updateSumOfNums();
    }

    // ИТОГИ
    function recalc() {
        let tc = 0, tw = 0;
        let currentTickets = getActiveLayer().tickets;

        for(let i=1; i<=24; i++) {
            let v = parseInt(document.getElementById('sfi'+i).value);
            if(isNaN(v) || v < 6 || v > 36) continue;
            
            let mw = parseInt(document.getElementById('sfm').value) || 550;
            let c = CF[v];
            
            currentTickets.forEach(t => {
                let q = t.qty[i-1];
                if(q > 0) {
                    tc += t.cost * q; 
                    if(t.nums.indexOf(v) !== -1) {
                        tw += mw * c * q; 
                    }
                }
            });
        }
        
        let pr = tw - tc;
        document.getElementById('stc').textContent = fm(tc) + ' ₽';
        document.getElementById('stw').textContent = fm(tw) + ' ₽';
        
        let pe = document.getElementById('stp');
        pe.textContent = (pr > 0 ? '+' : '') + fm(pr) + ' ₽';
        
        if(pr >= 0) { pe.style.color = '#ffffff'; pe.classList.remove('neg'); }
        else { pe.style.color = '#ff4444'; pe.classList.add('neg'); }
    }

    // Старт
    renderTabs();
</script>
