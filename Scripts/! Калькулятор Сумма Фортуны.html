<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор Сумма Фортуны</title>
    <style>
        body {
            background: radial-gradient(circle at center, #3a0505 0%, #150000 80%, #000000 100%);
            color: #e0e0e0;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 10px;
            height: 100vh;
            overflow: hidden;
            box-sizing: border-box;
        }
        .sp {
            background: linear-gradient(180deg, #1a0808 0%, #120404 100%);
            border: 2px solid #8a6a2a;
            border-radius: 12px;
            height: 100%;
            display: grid;
            grid-template-rows: auto 1fr auto;
            box-shadow: 0 0 60px rgba(212, 175, 55, 0.15);
            overflow: hidden;
        }
        .sh {
            background: linear-gradient(90deg, #2a0a0a 0%, #1a0505 50%, #2a0a0a 100%);
            padding: 12px 25px 16px 25px;
            border-bottom: 2px solid #8a6a2a;
            text-align: center;
            position: relative;
        }
        .sh::after {
            content: ''; position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%);
            width: 80px; height: 8px; background: #d4af37; border-radius: 10px; box-shadow: 0 0 10px #d4af37;
        }
        .sh h2 {
            color: #d4af37; font-family: 'Georgia', serif; font-size: 20px; font-weight: 700;
            letter-spacing: 6px; margin: 0; text-shadow: 0 2px 4px rgba(0,0,0,0.8), 0 0 15px rgba(212, 175, 55, 0.3);
        }
        .sh-sub { color: #8a6a5a; font-size: 14px; margin-top: 6px; font-weight: 600; letter-spacing: 1px; }
        .sh-sub-val { color: #e0e0e0; font-weight: 800; font-size: 16px; }

        .sb { display: grid; grid-template-columns: 360px 1fr; gap: 20px; padding: 15px 20px; overflow: hidden; }

        .left-panel { display: flex; flex-direction: column; gap: 12px; overflow-y: auto; padding-right: 10px; }
        .left-panel::-webkit-scrollbar { width: 6px; }
        .left-panel::-webkit-scrollbar-track { background: #1a0808; border-radius: 3px; }
        .left-panel::-webkit-scrollbar-thumb { background: #8a6a2a; border-radius: 3px; }

        .ss { margin-bottom: 0; }
        .ss h3 {
            color: #d4af37; font-size: 10px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px;
            padding-bottom: 6px; border-bottom: 1px solid #3a1a0a; font-weight: 700; display: flex; align-items: center; gap: 10px;
        }
        .sr { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
        .sr label { color: #a09080; font-size: 12px; min-width: 140px; }
        .sr input {
            background: #0d0404; border: 1px solid #4a1a0a; color: #f5c518; font-size: 14px; padding: 6px 10px;
            border-radius: 6px; width: 100%; font-weight: 700; outline: 0; box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
        }
        .sr input:focus { border-color: #d4af37; }

        .draw-mode-switch { display: flex; gap: 4px; flex: 1; }
        .mode-btn {
            flex: 1; background: #2a0808; border: 1px solid #4a1a0a; color: #aaa; padding: 6px 8px;
            border-radius: 5px; cursor: pointer; font-size: 11px; font-weight: 800; transition: 0.2s; white-space: nowrap;
        }
        .mode-btn:hover { color: #d4af37; border-color: #d4af37; }
        .mode-btn.active { background: #d4af37; border-color: #d4af37; color: #1a0505; box-shadow: 0 0 8px rgba(212, 175, 55, 0.25); }
        
        .ltabs { display: flex; gap: 4px; flex-wrap: wrap; }
        .ltab {
            display: flex; align-items: center; gap: 4px; background: #2a0808; border: 1px solid #4a1a0a;
            color: #aaa; padding: 5px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 700; user-select: none; transition: 0.2s;
        }
        .ltab:hover { color: #d4af37; border-color: #d4af37; }
        .ltab.active { background: #d4af37; color: #1a0505; border-color: #d4af37; }
        .ltab-close { color: #555; font-size: 12px; line-height: 1; padding: 0 2px; border-radius: 2px; transition: 0.2s; }
        .ltab-close:hover { color: #ff4444; }
        .ltab.active .ltab-close { color: #1a0505; opacity: 0.5; }
        .ltab.active .ltab-close:hover { color: #ff0000; opacity: 1; }
        .ltab-single .ltab-close { display: none; }
        .ltab-add { color: #666; border-style: dashed; font-weight: 800; }
        .ltab-add:hover { color: #f5c518; border-color: #f5c518; }

        .cg { display: grid; grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); gap: 3px; }
        .cc { background: #1f0a05; border: 1px solid #3a1508; border-radius: 4px; padding: 3px 2px; text-align: center; }
        .cc .n { color: #ddd; font-weight: 800; font-size: 12px; }
        .cc .v { font-weight: 800; font-size: 9px; margin-top: 1px; }
        
        .ng { display: grid; grid-template-columns: repeat(9, 1fr); gap: 5px; margin-bottom: 8px; }
        .nb {
            background: #2a0808; border: 1px solid #4a1a0a; color: #bbb; padding: 10px 2px; border-radius: 6px;
            cursor: pointer; font-size: 15px; font-weight: 800; text-align: center; transition: 0.2s; user-select: none;
        }
        .nb:hover { border-color: #d4af37; color: #d4af37; }
        .nb.on { background: linear-gradient(180deg, #f5c518, #d4af37); color: #1a0505; border-color: #fff; box-shadow: 0 0 10px rgba(245, 197, 24, 0.4); }

        .ti { color: #8a7a6a; font-size: 12px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
        .ti b { color: #f5c518; }
        .clr { background: 0 0; border: 0; color: #8a6a5a; font-size: 11px; cursor: pointer; text-decoration: underline; padding: 0; }
        .clr:hover { color: #d4af37; }
        .ab {
            background: linear-gradient(180deg, #f5c518, #b8860b); color: #1a0505; border: 0; padding: 8px 15px;
            border-radius: 6px; font-size: 13px; font-weight: 800; cursor: pointer; transition: 0.3s; letter-spacing: 1px; text-transform: uppercase; width: 100%;
        }
        .ab:hover { box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4); }

        .tci { background: #1f0a05; border: 1px solid #3a1508; border-radius: 8px; padding: 10px; margin-bottom: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .tci-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .tci-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .tci .tn { color: #f5c518; font-weight: 800; font-size: 13px; }
        .tci .tc { color: #8a6a5a; font-size: 11px; }
        .td-btn { background: #3a0a0a; border: 1px solid #5a1a0a; color: #ff5555; width: 24px; height: 24px; border-radius: 4px; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; transition: 0.2s; flex-shrink: 0; }
        .td-btn:hover { background: #ff5555; color: #fff; }

        .auto-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px dashed #3a1508; }
        .auto-row input[type="checkbox"] { accent-color: #d4af37; width: 16px; height: 16px; cursor: pointer; }
        .auto-row label { color: #d4af37; font-size: 12px; cursor: pointer; font-weight: 700; user-select: none; }
        .step-input {
            background: #0d0404; border: 1px solid #4a1a0a; color: #f5c518; font-size: 12px; padding: 4px 6px;
            border-radius: 4px; width: 44px; text-align: center; outline: 0; font-weight: 800;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.5); transition: 0.2s;
        }
        .step-input:focus { border-color: #d4af37; }
        .step-input::placeholder { color: #3a2a1a; font-weight: 400; font-size: 11px; }
        .step-hint { color: #5a4a3a; font-size: 10px; font-weight: 600; white-space: nowrap; }

        .qg { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; padding-top: 8px; border-top: 1px dashed #3a1508; }
        .qi-wrap { display: flex; flex-direction: column; align-items: center; }
        .qi-label { font-size: 8px; color: #6a4a3a; margin-bottom: 2px; font-weight: 700; }
        .qi { background: #0d0404; border: 1px solid #3a1508; color: #f5c518; font-size: 11px; padding: 5px 2px; width: 100%; text-align: center; border-radius: 3px; outline: 0; font-weight: 700; -moz-appearance: textfield; box-shadow: inset 0 1px 2px rgba(0,0,0,0.5); transition: 0.2s; }
        .qi::-webkit-inner-spin-button, .qi::-webkit-outer-spin-button { -webkit-appearance: none; }
        .qi:focus { border-color: #d4af37; background: #1a0a05; }
        .qi:disabled { opacity: 0.4; cursor: not-allowed; background: #0a0202; }

        .right-panel { display: flex; flex-direction: column; height: 100%; min-height: 0; gap: 10px; }
        
        .days-bar {
            background: #1f0a05; border: 1px solid #3a1508; border-radius: 8px; padding: 8px 12px;
            display: flex; align-items: flex-start; gap: 8px; flex-wrap: wrap; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .days-sidebar {
            display: flex; flex-direction: column; gap: 6px; flex-shrink: 0;
        }
        .btn-load {
            background: #2a0808; border: 1px solid #4a1a0a; color: #aaa; padding: 5px 12px;
            border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 700; transition: 0.2s;
            white-space: nowrap; user-select: none; text-align: center;
        }
        .btn-load:hover { color: #d4af37; border-color: #d4af37; }
        .days-bar > input[type="file"] { display: none; }
        .days-filename { color: #5a4a3a; font-size: 9px; font-weight: 600; text-align: center; max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: none; }
        .days-filename.show { display: block; }
        .days-filename span { color: #8a6a5a; }

        .days-tabs { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }
        
        .month-group { width: 100%; }
        .month-header {
            display: flex; align-items: center; gap: 8px;
            background: #2a1008; border: 1px solid #5a2a1a; color: #c8920a;
            padding: 6px 12px; border-radius: 5px; cursor: pointer;
            font-size: 12px; font-weight: 800; transition: 0.2s; user-select: none; width: 100%;
        }
        .month-header:hover { background: #3a1a0a; border-color: #d4af37; color: #d4af37; }
        .month-header.open {
            background: #3a1a05; border-color: #d4af37; border-bottom-left-radius: 0; border-bottom-right-radius: 0;
            color: #d4af37; box-shadow: 0 0 8px rgba(212, 175, 55, 0.15);
        }
        .mh-arrow { font-size: 9px; color: #6a4a2a; transition: 0.2s; }
        .month-header.open .mh-arrow { color: #d4af37; }
        .mh-title { white-space: nowrap; }
        .mh-count { color: #4a3a2a; font-size: 10px; font-weight: 600; }
        .month-header.open .mh-count { color: #6a5a3a; }
        .month-calc {
            display: inline-flex; align-items: center; gap: 5px; margin-left: auto;
            color: #8a6a5a; font-size: 10px; font-weight: 700; cursor: pointer; white-space: nowrap;
        }
        .month-calc:hover, .month-calc.checked { color: #f5c518; }
        .month-calc input { margin: 0; accent-color: #d4af37; cursor: pointer; }

        .month-dates {
            display: none; gap: 4px; flex-wrap: wrap;
            padding: 6px 0 2px 4px;
            border: 1px solid #5a2a1a; border-top: none;
            border-radius: 0 0 5px 5px; background: #150a05;
        }
        .month-dates.show { display: flex; }

        .day-tab {
            background: #2a0808; border: 1px solid #4a1a0a; color: #aaa; padding: 5px 12px;
            border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 700; transition: 0.2s;
            user-select: none; white-space: nowrap;
        }
        .day-tab:hover { color: #d4af37; border-color: #d4af37; }
        .day-tab.active { background: #d4af37; color: #1a0505; border-color: #d4af37; box-shadow: 0 0 8px rgba(212, 175, 55, 0.3); }
        .day-tab .dt-count { font-size: 9px; opacity: 0.7; margin-left: 3px; }

        .calc-scope {
            display: inline-block; margin-left: 8px; padding: 2px 7px; border-radius: 10px;
            background: #2a1008; border: 1px solid #5a2a1a; color: #c8920a;
            font-size: 9px; font-weight: 700; text-transform: none; letter-spacing: 0;
        }
        .calc-scope.month { background: #2a1a05; border-color: #8a6a2a; color: #f5c518; }

        .autofill-box {
            background: #1f0a05; border: 1px solid #3a1508; border-radius: 8px; padding: 10px 15px;
            display: flex; align-items: center; gap: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .autofill-box input {
            flex: 1; background: #0d0404; border: 1px solid #4a1a0a; color: #f5c518; font-size: 12px;
            padding: 8px 10px; border-radius: 6px; outline: 0; box-shadow: inset 0 1px 3px rgba(0,0,0,0.5); font-weight: 600;
        }
        .autofill-box input::placeholder { color: #4a3a2a; font-weight: 400; }
        .autofill-box input:focus { border-color: #d4af37; }
        .btn-fill {
            background: linear-gradient(180deg, #f5c518, #b8860b); color: #1a0505; border: 0; padding: 8px 15px;
            border-radius: 6px; font-size: 11px; font-weight: 800; cursor: pointer; transition: 0.3s; letter-spacing: 0.5px; white-space: nowrap;
        }
        .btn-fill:hover { box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4); }

        .dg { 
            --draw-rows: 4;
            display: grid; grid-template-columns: repeat(6, minmax(0, 1fr));
            grid-template-rows: repeat(var(--draw-rows), minmax(48px, 1fr));
            gap: 6px; flex: 1; min-height: 0; overflow-y: auto; align-content: start; padding-right: 4px;
        }
        .dg::-webkit-scrollbar { width: 6px; }
        .dg::-webkit-scrollbar-track { background: #1a0808; border-radius: 3px; }
        .dg::-webkit-scrollbar-thumb { background: #8a6a2a; border-radius: 3px; }
        .di { background: #1a0808; border: 1px solid #3a1508; border-radius: 8px; padding: 6px; display: flex; align-items: center; gap: 4px; min-width: 0; transition: 0.3s; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .di.win { border-color: #d4af37; background: #2a1a05; box-shadow: 0 0 20px rgba(212, 175, 55, 0.2); }
        .di.miss { border-color: #5a2020; }
        .dn { color: #6a4a3a; font-size: 11px; font-weight: 800; min-width: 22px; font-style: italic; }
        .di input { background: #0d0404; border: 1px solid #4a1a0a; color: #fff; font-size: 15px; padding: 5px; border-radius: 4px; width: 36px; text-align: center; outline: 0; font-weight: 800; -moz-appearance: textfield; box-shadow: inset 0 1px 3px rgba(0,0,0,0.5); }
        .di input::-webkit-inner-spin-button, .di input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .di input:focus { border-color: #d4af37; }
        .dr { font-size: 9px; flex: 1; min-width: 0; display: flex; align-items: center; justify-content: flex-end; gap: 4px; text-align: right; line-height: 1.2; color: #666; white-space: nowrap; }
        .draw-result-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
        .draw-clear { flex: 0 0 auto; background: #2a0808; border: 1px solid #5a1a0a; color: #a77b68; padding: 2px 4px; border-radius: 3px; font-size: 7px; line-height: 1; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
        .draw-clear:hover, .draw-clear:focus { border-color: #d4af37; color: #f5c518; outline: 0; }
        .dr.w { color: #f5c518; font-weight: 900; text-shadow: 0 0 10px rgba(245, 197, 24, 0.7); font-size: 16px; }
        .dr.m { color: #cc4444; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;}

        .sf { 
            background: linear-gradient(180deg, #1f0a05, #140606); border-top: 2px solid #8a6a2a; 
            padding: 12px 25px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }
        .tpl { color: #8a6a5a; font-size: 10px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 3px; font-weight: 700; }
        .tpv { font-size: 22px; font-weight: 900; font-family: 'Georgia', serif; }
        .tpc .tpv { color: #ff4444; text-shadow: 0 0 10px rgba(255, 68, 68, 0.3); }
        .tpw .tpv { color: #f5c518; text-shadow: 0 0 15px rgba(245, 197, 24, 0.4); }
        .tpp .tpv { color: #ffffff; text-shadow: 0 0 10px rgba(255, 255, 255, 0.3); }
        .tpp .tpv.neg { color: #ff4444; text-shadow: 0 0 10px rgba(255, 68, 68, 0.3); }
        .tppct .tpv { color: #44ff88; text-shadow: 0 0 10px rgba(68, 255, 136, 0.3); }
        .tppct .tpv.neg { color: #ff4444; text-shadow: 0 0 10px rgba(255, 68, 68, 0.3); }
        .tppct .tpv.zero { color: #666; text-shadow: none; }
        
        .rb { background: #2a0808; border: 1px solid #5a1a0a; color: #8a6a5a; padding: 4px 10px; border-radius: 4px; font-size: 9px; cursor: pointer; transition: 0.2s; font-weight: 700; text-transform: uppercase; }
        .rb:hover { border-color: #ff4444; color: #ff4444; background: #3a0a0a; }
    </style>
</head>
<body>

<div class="sp">
    <div class="sh">
        <h2>СУММА ФОРТУНЫ</h2>
        <div class="sh-sub">Сумма выпавших чисел: <span class="sh-sub-val" id="sum-nums">0</span></div>
    </div>
    
    <div class="sb">
        <div class="left-panel">
            <div class="ss">
                <h3>Настройки</h3>
                <div class="sr"><label>Цена цифры, ₽</label><input type="number" id="sfp" value="550" min="1"></div>
                <div class="sr"><label>Скидка, %</label><input type="number" id="sfd" value="0" min="0" max="100"></div>
                <div class="sr"><label>Мин. выигрыш, ₽</label><input type="number" id="sfm" value="550" min="1"></div>
                <div class="sr">
                    <label>Режим тиражей</label>
                    <div class="draw-mode-switch" id="draw-mode-switch">
                        <button type="button" class="mode-btn active" data-count="24">24</button>
                        <button type="button" class="mode-btn" data-count="96" title="Каждые 15 минут: 00:07–23:52 МСК">96 · 15 мин</button>
                    </div>
                </div>
            </div>

            <div class="ss">
                <h3>Слои комбинаций</h3>
                <div class="ltabs" id="ltabs"></div>
            </div>

            <div class="ss">
                <h3>Коэффициенты</h3>
                <div class="cg" id="sfcg"></div>
            </div>

            <div class="ss">
                <h3>Создание билета</h3>
                <div class="ng" id="sfng"></div>
                <div class="ti">Выбрано: <b id="sfsc">0</b> | <b id="sfscc">0 ₽</b> <button class="clr" id="sfcl">Сброс</button></div>
                <button class="ab" id="sfa">Добавить билет</button>
            </div>

            <div class="ss" id="sfts" style="display:none">
                <h3>Ставки (<span id="sftc">0</span>) <button class="rb" id="sftd" style="margin-left:auto">Удалить все</button></h3>
                <div id="sftl"></div>
            </div>
        </div>

        <div class="right-panel">
            <div class="days-bar" id="days-bar">
                <div class="days-sidebar">
                    <label class="btn-load" for="file-input">Загрузить файл</label>
                    <div class="days-filename" id="days-filename"><span id="days-fname"></span></div>
                </div>
                <input type="file" id="file-input" accept=".csv,.txt">
                <div class="days-tabs" id="days-tabs"></div>
            </div>

            <div class="autofill-box">
                <input type="text" id="af-input" placeholder="Вставь сюда числа (через запятую) или Ctrl+V">
                <button class="btn-fill" id="af-btn">Заполнить</button>
            </div>
            
            <div class="ss" style="margin-bottom: 0; height: 100%; min-height: 0; display: flex; flex-direction: column;">
                <h3>Тиражи (<span id="draw-count">24</span>) <span class="calc-scope" id="calc-scope">День</span></h3>
                <div class="dg" id="sfdg"></div>
            </div>
        </div>
    </div>

    <div class="sf">
        <div class="tpc"><div class="tpl">Затраты</div><div class="tpv" id="stc">0 ₽</div></div>
        <div class="tpw"><div class="tpl">Выигрыш</div><div class="tpv" id="stw">0 ₽</div></div>
        <div class="tpp"><div class="tpl">Прибыль</div><div class="tpv" id="stp">0 ₽</div></div>
        <div class="tppct"><div class="tpl">% Выигрыша</div><div class="tpv" id="stpct">—</div></div>
    </div>
</div>

<script>
    const CF = {
        6:8000, 7:6000, 8:4000, 9:250, 10:140, 11:70, 12:55, 13:30, 14:24, 15:18, 16:12,
        17:10, 18:9, 19:8, 20:7, 21:7, 22:7, 23:8, 24:9, 25:10, 26:12, 27:18, 28:24,
        29:30, 30:55, 31:70, 32:140, 33:250, 34:4000, 35:6000, 36:8000
    };

    const MONTH_NAMES = {
        '01':'Январь','02':'Февраль','03':'Март','04':'Апрель','05':'Май','06':'Июнь',
        '07':'Июль','08':'Август','09':'Сентябрь','10':'Октябрь','11':'Ноябрь','12':'Декабрь'
    };

    const DRAW_COUNTS = [24, 96];
    const MAX_DRAW_COUNT = 96;
    const MAX_SAFE_AUTO_QTY = Number.MAX_SAFE_INTEGER;

    let layers = [{ id: 1, name: 'Слой 1', tickets: [] }];
    let activeLayerId = 1;
    let layerCounter = 1;
    let sn = new Set(); 
    let drawCount = 24;
    let drawValues = new Array(MAX_DRAW_COUNT).fill('');

    let loadedDays = {};
    let activeDay = null;
    let loadedFileName = '';
    let openMonthKey = null;
    let calculationMonthKey = null;

    function fm(n) {
        if (!Number.isFinite(n)) return '\u221e';
        return Math.round(n).toLocaleString('ru-RU').replace(/[\u00a0\u202f]/g, ' ');
    }
    function fc(v) { return v >= 1000 ? (v/1000)+'К' : ''+v; }
    function getActiveLayer() { return layers.find(l => l.id === activeLayerId); }

    function getMonthKey(date) {
        let parts = String(date || '').split('.');
        return parts.length === 3 ? parts[1] + '.' + parts[2] : '';
    }

    function dateSortValue(date) {
        let parts = String(date || '').split('.');
        if (parts.length !== 3) return 0;
        return parseInt(parts[2] + parts[1] + parts[0]) || 0;
    }

    function getMonthDates(monthKey) {
        return Object.keys(loadedDays)
            .filter(date => getMonthKey(date) === monthKey)
            .sort((a, b) => dateSortValue(a) - dateSortValue(b));
    }

    function getMonthLabel(monthKey) {
        let parts = String(monthKey || '').split('.');
        if (parts.length !== 2) return monthKey || '';
        return (MONTH_NAMES[parts[0]] || parts[0]) + ' ' + parts[1];
    }

    function updateCalculationScope() {
        let scope = document.getElementById('calc-scope');
        if (!scope) return;
        if (calculationMonthKey) {
            let dates = getMonthDates(calculationMonthKey);
            let draws = dates.reduce((total, date) => total + Math.min(loadedDays[date].length, drawCount), 0);
            scope.textContent = getMonthLabel(calculationMonthKey) + ' · ' + draws + ' тир.';
            scope.className = 'calc-scope month';
        } else {
            scope.textContent = activeDay ? 'День · ' + activeDay : 'День';
            scope.className = 'calc-scope';
        }
    }

    function ensureTicketQty(ticket) {
        if (!Array.isArray(ticket.qty)) ticket.qty = [];
        while (ticket.qty.length < drawCount) ticket.qty.push(0);
    }

    function captureDrawValues() {
        for (let i = 1; i <= drawCount; i++) {
            let inp = document.getElementById('sfi' + i);
            if (inp) drawValues[i - 1] = inp.value;
        }
    }

    function setDrawValues(values) {
        drawValues.fill('');
        values.slice(0, MAX_DRAW_COUNT).forEach((value, i) => { drawValues[i] = value; });
    }

    function updateDrawModeUI() {
        document.getElementById('draw-count').textContent = drawCount;
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.classList.toggle('active', parseInt(btn.dataset.count) === drawCount);
        });
        let grid = document.getElementById('sfdg');
        grid.style.setProperty('--draw-rows', Math.ceil(drawCount / 6));
        document.getElementById('af-input').placeholder = 'Вставь сюда до ' + drawCount + ' чисел (через запятую) или Ctrl+V';
    }

    function setDrawMode(count) {
        count = parseInt(count);
        if (!DRAW_COUNTS.includes(count)) return;
        if (count === drawCount) { updateDrawModeUI(); return; }
        captureDrawValues();
        drawCount = count;
        layers.forEach(layer => layer.tickets.forEach(ensureTicketQty));
        updateDrawModeUI();
        renderDrawGrid();
        renderTk();
        fullRecalc();
    }

    function getBaseCost(numCount) {
        let p = parseInt(document.getElementById('sfp').value) || 0;
        let d = parseInt(document.getElementById('sfd').value) || 0;
        d = Math.min(100, Math.max(0, d)); 
        return numCount * p * (1 - d / 100);
    }

    function parseStep(stepStr) {
        let s = (stepStr || '').trim();
        if (!s) return { type: 'add', value: 1, display: '+1' };
        if (s.charAt(0) === '*') {
            let v = parseFloat(s.substring(1));
            if (!isNaN(v) && v > 0) return { type: 'mul', value: v, display: s };
        }
        if (s.charAt(0) === '+') {
            let v = parseInt(s.substring(1));
            if (!isNaN(v) && v > 0) return { type: 'add', value: v, display: s };
        }
        return { type: 'add', value: 1, display: '+1' };
    }

    function applyAutoCalc(ticket) {
        if (!ticket.auto) return;
        ensureTicketQty(ticket);
        let rule = parseStep(ticket.step);
        let currentQty = 1;
        ticket.autoLimited = false;
        for (let i = 1; i <= drawCount; i++) {
            ticket.qty[i - 1] = currentQty;
            let drawnVal = parseInt(document.getElementById('sfi' + i).value);
            if (!isNaN(drawnVal) && drawnVal >= 6 && drawnVal <= 36 && ticket.nums.includes(drawnVal)) {
                currentQty = 1;
            } else {
                if (rule.type === 'mul') {
                    currentQty = Math.round(currentQty * rule.value);
                } else {
                    currentQty = currentQty + rule.value;
                }
                if (!Number.isSafeInteger(currentQty) || currentQty > MAX_SAFE_AUTO_QTY) {
                    currentQty = MAX_SAFE_AUTO_QTY;
                    ticket.autoLimited = true;
                }
            }
        }
    }

    // === УНИВЕРСАЛЬНЫЙ ПАРСЕР ===
    function parseFile(text) {
        text = text.replace(/^\uFEFF/, '');
        let lines = text.split(/\r?\n/).filter(l => l.trim());
        if (lines.length < 1) return {};

        // Определяем формат по первому разделителю в первой строке данных
        let firstLine = lines[0].trim();

        // Проверяем заголовок: если есть ; — это CSV с суммами
        if (firstLine.indexOf(';') !== -1) {
            return parseCSV_Sums(lines);
        }

        // TXT: Номер,Дата,ч1..ч6 или Дата,ч1..ч6
        if (firstLine.indexOf(',') !== -1) {
            let testParts = firstLine.split(',').map(s => s.trim());
            let firstIsDate = /^\d{2}\.\d{2}\.\d{4}$/.test(testParts[0] || '');
            let secondIsDate = /^\d{2}\.\d{2}\.\d{4}$/.test(testParts[1] || '');
            if ((firstIsDate && testParts.length >= 7) || (secondIsDate && testParts.length >= 8)) {
                return parseTXT_Numbers(lines);
            }
        }

        // Если не распознали — пробуем CSV
        return parseCSV_Sums(lines);
    }

    function parseTimeOrder(value) {
        let match = String(value || '').match(/(\d{1,2}):(\d{2})/);
        if (!match) return null;
        let hours = parseInt(match[1]);
        let minutes = parseInt(match[2]);
        if (hours < 0 || hours > 23 || minutes < 0 || minutes > 59) return null;
        return hours * 60 + minutes;
    }

    function finalizeParsedDays(days) {
        Object.keys(days).forEach(date => {
            days[date].sort((a, b) => {
                if (a.order !== null && b.order !== null && a.order !== b.order) return a.order - b.order;
                return a.seq - b.seq;
            });
            days[date] = days[date].map(item => item.sum);
        });
        return days;
    }

    // Старый формат: Дата;Час;Сумма
    function parseCSV_Sums(lines) {
        let days = {};
        for (let i = 0; i < lines.length; i++) {
            let parts = lines[i].split(';').map(s => s.trim());
            if (parts.length < 3) continue;
            let date = parts[0];
            let sum = parseInt(parts[2]);
            if (isNaN(sum)) continue;
            if (!days[date]) days[date] = [];
            days[date].push({ sum: sum, order: parseTimeOrder(parts[1]), seq: i });
        }
        return finalizeParsedDays(days);
    }

    // TXT: Номер,Дата,ч1,ч2,ч3,ч4,ч5,ч6 или Дата,ч1,ч2,ч3,ч4,ч5,ч6
    function parseTXT_Numbers(lines) {
        let days = {};
        for (let i = 0; i < lines.length; i++) {
            let parts = lines[i].split(',').map(s => s.trim());
            let dateIndex = /^\d{2}\.\d{2}\.\d{4}$/.test(parts[0] || '') ? 0 : 1;
            let numberStart = dateIndex + 1;
            let date = parts[dateIndex];
            if (!/^\d{2}\.\d{2}\.\d{4}$/.test(date || '') || parts.length < numberStart + 6) continue;
            // Суммируем ровно 6 чисел после даты
            let sum = 0;
            let valid = true;
            for (let j = numberStart; j < numberStart + 6; j++) {
                let n = parseInt(parts[j]);
                if (isNaN(n)) { valid = false; break; }
                sum += n;
            }
            if (!valid) continue;
            if (!days[date]) days[date] = [];
            let drawNumber = dateIndex === 1 ? parseInt(parts[0]) : null;
            days[date].push({ sum: sum, order: isNaN(drawNumber) ? null : drawNumber, seq: i });
        }
        return finalizeParsedDays(days);
    }

    document.getElementById('file-input').addEventListener('change', function(e) {
        let file = e.target.files[0];
        if (!file) return;
        loadedFileName = file.name;
        let reader = new FileReader();
        reader.onload = function(ev) {
            let parsed = parseFile(ev.target.result);
            if (Object.keys(parsed).length === 0) {
                alert('Не удалось найти тиражи в файле.\n\nПоддерживаемые форматы:\n1) Дата;Час;Сумма (через ;)\n2) Номер,Дата,ч1,ч2,ч3,ч4,ч5,ч6\n3) Дата,ч1,ч2,ч3,ч4,ч5,ч6');
                return;
            }
            loadedDays = parsed;
            calculationMonthKey = null;
            let firstDate = Object.keys(loadedDays)[0];
            activeDay = firstDate;
            let fp = firstDate.split('.');
            openMonthKey = fp[1] + '.' + fp[2];
            fillDay(activeDay);
            renderDayTabs();
            document.getElementById('days-fname').textContent = loadedFileName;
            document.getElementById('days-filename').classList.add('show');
        };
        reader.readAsText(file, 'UTF-8');
        this.value = '';
    });

    function fillDay(date) {
        let values = loadedDays[date];
        if (!values) return;
        activeDay = date;
        if (values.length > 24 && drawCount !== 96) setDrawMode(96);
        if (values.length > MAX_DRAW_COUNT) alert('В выбранном дне найдено ' + values.length + ' тиражей. Будут использованы первые ' + MAX_DRAW_COUNT + '.');
        setDrawValues(values);
        renderDrawGrid();
        renderDayTabs();
        fullRecalc();
    }

    function renderDayTabs() {
        let cont = document.getElementById('days-tabs');
        cont.innerHTML = '';
        let dates = Object.keys(loadedDays);
        if (!dates.length) return;

        let months = {};
        dates.forEach(date => {
            let mk = getMonthKey(date);
            if (!months[mk]) months[mk] = [];
            months[mk].push(date);
        });
        Object.keys(months).forEach(mk => {
            months[mk].sort((a, b) => dateSortValue(a) - dateSortValue(b));
        });

        let monthKeys = Object.keys(months).sort((a, b) => {
            let pa = a.split('.'), pb = b.split('.');
            if (pa[1] !== pb[1]) return pa[1] - pb[1];
            return pa[0] - pb[0];
        });

        monthKeys.forEach(mk => {
            let mp = mk.split('.');
            let mName = MONTH_NAMES[mp[0]] || mp[0];
            let mYear = mp[1];
            let label = mName + ' ' + mYear;
            let isOpen = (mk === openMonthKey);

            let group = document.createElement('div');
            group.className = 'month-group';

            let header = document.createElement('div');
            header.className = 'month-header' + (isOpen ? ' open' : '');
            header.innerHTML = '<span class="mh-arrow">' + (isOpen ? '\u25bc' : '\u25b6') + '</span><span class="mh-title">' + label + '</span>';

            let monthCalc = document.createElement('label');
            monthCalc.className = 'month-calc' + (calculationMonthKey === mk ? ' checked' : '');
            let monthCheckbox = document.createElement('input');
            monthCheckbox.type = 'checkbox';
            monthCheckbox.checked = calculationMonthKey === mk;
            let monthCalcText = document.createElement('span');
            monthCalcText.textContent = 'Посчитать месяц';
            monthCalc.appendChild(monthCheckbox);
            monthCalc.appendChild(monthCalcText);
            monthCalc.onclick = function(e) { e.stopPropagation(); };
            monthCheckbox.onchange = function(e) {
                e.stopPropagation();
                calculationMonthKey = this.checked ? mk : null;
                if (this.checked) openMonthKey = mk;
                if (this.checked && !months[mk].includes(activeDay)) {
                    fillDay(months[mk][0]);
                } else {
                    renderDayTabs();
                    fullRecalc();
                }
            };

            let monthCount = document.createElement('span');
            monthCount.className = 'mh-count';
            monthCount.textContent = months[mk].length + ' дн.';
            header.appendChild(monthCalc);
            header.appendChild(monthCount);

            let datesCont = document.createElement('div');
            datesCont.className = 'month-dates' + (isOpen ? ' show' : '');

            months[mk].forEach(date => {
                let tab = document.createElement('div');
                tab.className = 'day-tab' + (date === activeDay ? ' active' : '');
                let count = loadedDays[date].length;
                let dp = date.split('.');
                let niceDate = dp[0].replace(/^0/, '') + '.' + dp[1].replace(/^0/, '') + '.' + dp[2];
                tab.innerHTML = niceDate + '<span class="dt-count">(' + count + ')</span>';
                tab.onclick = function(e) { e.stopPropagation(); fillDay(date); };
                datesCont.appendChild(tab);
            });

            header.onclick = function() {
                if (openMonthKey === mk) return;
                openMonthKey = mk;
                cont.querySelectorAll('.month-header').forEach(h => {
                    h.classList.remove('open');
                    h.querySelector('.mh-arrow').textContent = '\u25b6';
                });
                cont.querySelectorAll('.month-dates').forEach(d => { d.classList.remove('show'); });
                this.classList.add('open');
                this.querySelector('.mh-arrow').textContent = '\u25bc';
                datesCont.classList.add('show');
                if (!months[mk].includes(activeDay)) {
                    fillDay(months[mk][0]);
                }
            };

            group.appendChild(header);
            group.appendChild(datesCont);
            cont.appendChild(group);
        });
    }

    function syncAutoInputs(tIdx) {
        let container = document.querySelector('.tci[data-tidx="' + tIdx + '"]');
        if (!container) return;
        let inputs = container.querySelectorAll('.qi');
        let ticket = getActiveLayer().tickets[tIdx];
        inputs.forEach((inp, i) => {
            if (document.activeElement !== inp) { inp.value = ticket.qty[i]; }
        });
    }

    document.getElementById('af-btn').onclick = function() {
        let raw = document.getElementById('af-input').value;
        let nums = raw.split(/[,\s\n]+/).map(n => parseInt(n.trim())).filter(n => !isNaN(n) && n >= 6 && n <= 36);
        if (nums.length === 0) { alert('Нет валидных чисел от 6 до 36!'); return; }
        if (nums.length > 24 && drawCount !== 96) setDrawMode(96);
        if (nums.length > MAX_DRAW_COUNT) alert('Найдено ' + nums.length + ' чисел. Будут использованы первые ' + MAX_DRAW_COUNT + '.');
        activeDay = null;
        openMonthKey = null;
        calculationMonthKey = null;
        renderDayTabs();
        setDrawValues(nums);
        renderDrawGrid();
        fullRecalc();
    };

    function renderTabs() {
        const cont = document.getElementById('ltabs'); cont.innerHTML = '';
        layers.forEach(l => {
            let t = document.createElement('div');
            t.className = 'ltab' + (l.id === activeLayerId ? ' active' : '') + (layers.length === 1 ? ' ltab-single' : '');
            let span = document.createElement('span'); span.textContent = l.name;
            let closeBtn = document.createElement('div'); closeBtn.className = 'ltab-close'; closeBtn.textContent = '\u00d7';
            t.onclick = (e) => { if (!e.target.classList.contains('ltab-close')) switchLayer(l.id); };
            closeBtn.onclick = (e) => { e.stopPropagation(); deleteLayer(l.id); };
            t.appendChild(span); t.appendChild(closeBtn); cont.appendChild(t);
        });
        let addBtn = document.createElement('div'); addBtn.className = 'ltab ltab-add'; addBtn.textContent = '+ Слой';
        addBtn.onclick = addLayer; cont.appendChild(addBtn);
    }

    function switchLayer(id) { activeLayerId = id; renderTabs(); renderTk(); fullRecalc(); }
    function addLayer() { layerCounter++; layers.push({ id: layerCounter, name: 'Слой ' + layerCounter, tickets: [] }); switchLayer(layerCounter); }
    function deleteLayer(id) {
        if (layers.length <= 1) return; 
        layers.splice(layers.findIndex(l => l.id === id), 1);
        if (activeLayerId === id) activeLayerId = layers[0].id;
        renderTabs(); renderTk(); fullRecalc();
    }

    const cg = document.getElementById('sfcg');
    for (let i = 6; i <= 36; i++) {
        let c = document.createElement('div'); c.className = 'cc'; let v = CF[i];
        let cl = v >= 4000 ? '#f5c518' : v >= 100 ? '#c8920a' : '#6a5a4a';
        c.innerHTML = '<div class="n">' + i + '</div><div class="v" style="color:' + cl + '">\u00d7' + fc(v) + '</div>';
        cg.appendChild(c);
    }

    const ng = document.getElementById('sfng');
    for (let i = 6; i <= 36; i++) {
        (function(n) {
            let b = document.createElement('div'); b.className = 'nb'; b.textContent = n;
            b.onclick = function() {
                if (sn.has(n)) { sn.delete(n); b.classList.remove('on'); } else { sn.add(n); b.classList.add('on'); }
                document.getElementById('sfsc').textContent = sn.size;
                document.getElementById('sfscc').textContent = fm(getBaseCost(sn.size)) + ' \u20bd';
            }; ng.appendChild(b);
        })(i);
    }

    const dg = document.getElementById('sfdg');
    function renderDrawGrid() {
        dg.innerHTML = '';
        updateDrawModeUI();
        for (let idx = 1; idx <= drawCount; idx++) {
            let d = document.createElement('div'); d.className = 'di'; d.id = 'sfd' + idx;
            d.innerHTML = '<div class="dn">T' + idx + '</div><input type="number" min="6" max="36" id="sfi' + idx + '"><div class="dr" id="sfr' + idx + '"><span class="draw-result-text" id="sfrt' + idx + '"></span><button type="button" class="draw-clear" title="Очистить все тиражи" aria-label="Очистить все тиражи">Очистить</button></div>';
            dg.appendChild(d);
            let input = document.getElementById('sfi' + idx);
            d.querySelector('.draw-clear').addEventListener('click', clearAllDraws);
            input.value = drawValues[idx - 1];
            input.addEventListener('input', function() {
                drawValues[idx - 1] = this.value;
                let val = parseInt(this.value);
                if (val >= 6 && val <= 36 && idx < drawCount) document.getElementById('sfi' + (idx + 1)).focus();
                activeDay = null;
                openMonthKey = null;
                calculationMonthKey = null;
                renderDayTabs();
                let currentTickets = getActiveLayer().tickets;
                currentTickets.forEach((t, tIdx) => {
                    if (t.auto) { applyAutoCalc(t); syncAutoInputs(tIdx); }
                });
                calcDraw(idx); updateSumOfNums(); recalc();
            });
        }
        dg.scrollTop = 0;
    }

    document.getElementById('sfa').onclick = function() {
        if (!sn.size) return;
        let nums = Array.from(sn).sort((a, b) => a - b); let cost = getBaseCost(nums.length);
        getActiveLayer().tickets.push({ nums: nums, cost: cost, qty: new Array(drawCount).fill(0), auto: false, step: '' });
        sn.clear(); ng.querySelectorAll('.nb').forEach(b => b.classList.remove('on'));
        document.getElementById('sfsc').textContent = '0'; document.getElementById('sfscc').textContent = '0 \u20bd';
        renderTk(); fullRecalc();
    };

    document.getElementById('sfcl').onclick = function() {
        sn.clear(); ng.querySelectorAll('.nb').forEach(b => b.classList.remove('on'));
        document.getElementById('sfsc').textContent = '0'; document.getElementById('sfscc').textContent = '0 \u20bd';
    };

    document.getElementById('sftd').onclick = function() { getActiveLayer().tickets = []; renderTk(); fullRecalc(); };

    function clearAllDraws() {
        setDrawValues([]);
        document.getElementById('af-input').value = '';
        renderDrawGrid();
        activeDay = null;
        openMonthKey = null;
        calculationMonthKey = null;
        renderDayTabs();
        updateSumOfNums(); recalc();
    }

    function updateTicketCosts() { let cost = getBaseCost(1); layers.forEach(l => { l.tickets.forEach(t => { t.cost = t.nums.length * cost; }); }); }
    function updateSumOfNums() {
        let sum = 0;
        for (let i = 1; i <= drawCount; i++) { let v = parseInt(document.getElementById('sfi' + i).value); if (!isNaN(v) && v >= 6 && v <= 36) sum += v; }
        document.getElementById('sum-nums').textContent = sum;
    }

    function fullRecalc() {
        let currentTickets = getActiveLayer().tickets;
        currentTickets.forEach((t, tIdx) => {
            if (t.auto) { applyAutoCalc(t); syncAutoInputs(tIdx); }
        });
        for (let i = 1; i <= drawCount; i++) { let val = parseInt(document.getElementById('sfi' + i).value); if (!isNaN(val) && val >= 6 && val <= 36) calcDraw(i); }
        updateSumOfNums(); recalc();
    }

    document.getElementById('sfp').addEventListener('input', function() {
        document.getElementById('sfscc').textContent = fm(getBaseCost(sn.size)) + ' \u20bd';
        updateTicketCosts(); renderTk(); fullRecalc(); 
    });
    document.getElementById('sfd').addEventListener('input', function() {
        document.getElementById('sfscc').textContent = fm(getBaseCost(sn.size)) + ' \u20bd';
        updateTicketCosts(); renderTk(); fullRecalc(); 
    });
    document.getElementById('sfm').addEventListener('input', function() { fullRecalc(); });

    function renderTk() {
        let sec = document.getElementById('sfts'), list = document.getElementById('sftl'); let currentTickets = getActiveLayer().tickets;
        document.getElementById('sftc').textContent = currentTickets.length;
        if (!currentTickets.length) { sec.style.display = 'none'; return; }
        sec.style.display = ''; list.innerHTML = '';
        
        currentTickets.forEach((t, i) => {
            ensureTicketQty(t);
            if (t.auto) applyAutoCalc(t);
            let d = document.createElement('div'); d.className = 'tci'; d.setAttribute('data-tidx', i);
            
            let top = document.createElement('div'); top.className = 'tci-top';
            top.innerHTML = '<div class="tci-left"><span class="tn">' + t.nums.join(', ') + '</span><span class="tc">' + fm(t.cost) + ' \u20bd</span></div><button class="td-btn" data-i="' + i + '">\u00d7</button>';
            d.appendChild(top);

            let autoRow = document.createElement('div'); autoRow.className = 'auto-row';

            let stepInput = document.createElement('input');
            stepInput.type = 'text'; stepInput.className = 'step-input';
            stepInput.value = t.step; stepInput.placeholder = '+1';
            stepInput.title = 'Пусто = +1\n+2 = плюс 2 билета\n*2 = умножение на 2';

            let autoCb = document.createElement('input'); 
            autoCb.type = 'checkbox'; autoCb.id = 'auto-cb-' + i; autoCb.checked = t.auto;

            let autoLabel = document.createElement('label'); 
            autoLabel.htmlFor = 'auto-cb-' + i; autoLabel.textContent = 'Авто';

            let stepHint = document.createElement('span'); stepHint.className = 'step-hint';

            function updateHint() {
                if (!t.auto) { stepHint.textContent = ''; return; }
                let rule = parseStep(t.step);
                let text = rule.type === 'mul' ? '(\u00d7' + rule.value + ' \u043f\u0440\u0438 \u043c\u0438\u043c\u043e)' : '(+' + rule.value + ' \u043f\u0440\u0438 \u043c\u0438\u043c\u043e)';
                stepHint.textContent = text + (t.autoLimited ? ' \u26a0 \u043b\u0438\u043c\u0438\u0442 \u0442\u043e\u0447\u043d\u043e\u0441\u0442\u0438' : '');
            }
            updateHint();

            stepInput.addEventListener('input', function() {
                t.step = this.value;
                if (t.auto) { applyAutoCalc(t); syncAutoInputs(i); }
                updateHint();
                if (t.auto) fullRecalc();
            });

            autoCb.addEventListener('change', function() {
                t.auto = this.checked;
                let inputs = d.querySelectorAll('.qi');
                inputs.forEach(inp => inp.disabled = this.checked);
                stepInput.disabled = !this.checked;
                stepInput.style.opacity = this.checked ? '1' : '0.4';
                if (this.checked) { applyAutoCalc(t); syncAutoInputs(i); }
                updateHint();
                fullRecalc();
            });

            if (!t.auto) { stepInput.style.opacity = '0.4'; stepInput.disabled = true; }

            autoRow.appendChild(stepInput);
            autoRow.appendChild(autoCb);
            autoRow.appendChild(autoLabel);
            autoRow.appendChild(stepHint);
            d.appendChild(autoRow);

            let qg = document.createElement('div'); qg.className = 'qg';
            for (let j = 1; j <= drawCount; j++) {
                (function(idx) {
                    let wrap = document.createElement('div'); wrap.className = 'qi-wrap';
                    let label = document.createElement('div'); label.className = 'qi-label'; label.textContent = 'T' + idx;
                    let input = document.createElement('input'); input.className = 'qi'; input.type = 'number'; input.min = '0'; input.value = t.qty[idx - 1];
                    if (t.auto) input.disabled = true;
                    input.addEventListener('input', function() { 
                        if (!t.auto) { t.qty[idx - 1] = Math.max(0, parseInt(this.value) || 0); calcDraw(idx); recalc(); }
                    });
                    wrap.appendChild(label); wrap.appendChild(input); qg.appendChild(wrap);
                })(j);
            }
            d.appendChild(qg); list.appendChild(d);
        });

        list.querySelectorAll('.td-btn').forEach(b => {
            b.onclick = function() { getActiveLayer().tickets.splice(parseInt(this.dataset.i), 1); renderTk(); fullRecalc(); };
        });
    }

    function calcDraw(idx) {
        let inp = document.getElementById('sfi' + idx); let res = document.getElementById('sfr' + idx); let resText = document.getElementById('sfrt' + idx); let wrap = document.getElementById('sfd' + idx); let val = parseInt(inp.value);
        if (isNaN(val) || val < 6 || val > 36) { resText.textContent = ''; res.className = 'dr'; wrap.classList.remove('win', 'miss'); return; }
        let mw = parseInt(document.getElementById('sfm').value) || 550; let c = CF[val]; let tw = 0, mc = 0; let currentTickets = getActiveLayer().tickets;
        currentTickets.forEach(t => { let q = t.qty[idx - 1]; if (q > 0) { if (t.nums.indexOf(val) !== -1) { tw += mw * c * q; mc += q; } } });
        if (mc > 0) { resText.textContent = mc + ' \u0448\u0442 \u2192 ' + fm(tw) + ' \u20bd'; res.className = 'dr w'; wrap.classList.add('win'); wrap.classList.remove('miss'); }
        else { resText.textContent = '\u041c\u0438\u043c\u043e'; res.className = 'dr m'; wrap.classList.add('miss'); wrap.classList.remove('win'); }
        updateSumOfNums();
    }

    function renderTotals(tc, tw) {
        let pr = tw - tc;
        document.getElementById('stc').textContent = fm(tc) + ' \u20bd'; 
        document.getElementById('stw').textContent = fm(tw) + ' \u20bd';
        let pe = document.getElementById('stp'); pe.textContent = (pr > 0 ? '+' : '') + fm(pr) + ' \u20bd';
        if (pr >= 0) { pe.style.color = '#ffffff'; pe.classList.remove('neg'); } else { pe.style.color = '#ff4444'; pe.classList.add('neg'); }

        let pctEl = document.getElementById('stpct');
        if (tc === 0) {
            pctEl.textContent = '\u2014';
            pctEl.className = 'tpv zero';
        } else {
            let pct = ((tw / tc) * 100);
            pctEl.textContent = (pct > 0 ? '+' : '') + pct.toFixed(1) + '%';
            pctEl.className = pct >= 0 ? 'tpv' : 'tpv neg';
        }
    }

    function recalcMonth(monthKey) {
        let dates = getMonthDates(monthKey);
        let currentTickets = getActiveLayer().tickets;
        let mw = parseInt(document.getElementById('sfm').value) || 550;
        let tc = 0, tw = 0, monthSum = 0;

        dates.forEach(date => {
            let values = loadedDays[date].slice(0, drawCount);
            values.forEach(value => {
                let v = parseInt(value);
                if (!isNaN(v) && v >= 6 && v <= 36) monthSum += v;
            });

            currentTickets.forEach(ticket => {
                ensureTicketQty(ticket);
                if (ticket.auto) {
                    let rule = parseStep(ticket.step);
                    let currentQty = 1;
                    values.forEach(value => {
                        let v = parseInt(value);
                        if (isNaN(v) || v < 6 || v > 36) return;
                        let q = currentQty;
                        tc += ticket.cost * q;
                        if (ticket.nums.indexOf(v) !== -1) {
                            tw += mw * CF[v] * q;
                            currentQty = 1;
                        } else {
                            currentQty = rule.type === 'mul' ? Math.round(currentQty * rule.value) : currentQty + rule.value;
                            if (!Number.isSafeInteger(currentQty) || currentQty > MAX_SAFE_AUTO_QTY) currentQty = MAX_SAFE_AUTO_QTY;
                        }
                    });
                } else {
                    values.forEach((value, index) => {
                        let v = parseInt(value);
                        if (isNaN(v) || v < 6 || v > 36) return;
                        let q = ticket.qty[index] || 0;
                        if (q <= 0) return;
                        tc += ticket.cost * q;
                        if (ticket.nums.indexOf(v) !== -1) tw += mw * CF[v] * q;
                    });
                }
            });
        });

        document.getElementById('sum-nums').textContent = monthSum;
        updateCalculationScope();
        renderTotals(tc, tw);
    }

    function recalc() {
        if (calculationMonthKey) {
            recalcMonth(calculationMonthKey);
            return;
        }

        let tc = 0, tw = 0; let currentTickets = getActiveLayer().tickets;
        for (let i = 1; i <= drawCount; i++) {
            let v = parseInt(document.getElementById('sfi' + i).value); if (isNaN(v) || v < 6 || v > 36) continue;
            let mw = parseInt(document.getElementById('sfm').value) || 550; let c = CF[v];
            currentTickets.forEach(t => { let q = t.qty[i - 1]; if (q > 0) { tc += t.cost * q; if (t.nums.indexOf(v) !== -1) { tw += mw * c * q; } } });
        }
        updateCalculationScope();
        renderTotals(tc, tw);
    }

    document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.addEventListener('click', function() { setDrawMode(this.dataset.count); });
    });

    renderDrawGrid();
    renderTabs();
</script>

</html>
