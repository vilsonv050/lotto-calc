<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NLOTO — статистика тиражей</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      background: #07111f;
      color: #f4f7fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 20% 0%, rgba(0, 202, 255, .18), transparent 32rem),
        radial-gradient(circle at 95% 95%, rgba(119, 74, 255, .2), transparent 34rem),
        #07111f;
    }

    .local-shell {
      width: min(720px, calc(100% - 32px));
      padding: 32px;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 24px;
      background: rgba(13, 28, 48, .78);
      box-shadow: 0 28px 80px rgba(0, 0, 0, .32);
      backdrop-filter: blur(18px);
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(47, 214, 132, .13);
      color: #78efad;
      font-size: 13px;
      font-weight: 700;
    }

    .badge::before {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      content: "";
      box-shadow: 0 0 14px currentColor;
    }

    h1 {
      margin: 20px 0 10px;
      font-size: clamp(30px, 6vw, 52px);
      letter-spacing: -.04em;
    }

    p {
      margin: 0 auto;
      max-width: 570px;
      color: #adbed1;
      font-size: 16px;
      line-height: 1.6;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 26px;
    }

    button {
      min-height: 44px;
      padding: 0 18px;
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: 12px;
      background: #eef5ff;
      color: #07111f;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
    }

    button.secondary {
      background: rgba(255, 255, 255, .06);
      color: #dbe7f4;
    }
  </style>
</head>
<body>
  <main class="local-shell">
    <span class="badge">Локальный режим работает</span>
    <h1>Статистика тиражей</h1>
    <p>
      Данные загружаются из официального API Национальной лотереи.
      Открывать сайт nloto.ru для работы приложения не требуется.
    </p>
    <div class="actions">
      <button type="button" onclick="location.reload()">Открыть статистику</button>
      <button class="secondary" type="button" id="stop-app">Остановить приложение</button>
    </div>
  </main>

  <script>
    (() => {
      "use strict";

      const nativeFetch = window.fetch.bind(window);
      const apiCdn = "https://static.nationallottery.ru/_next/image/napi/";
      const dictionariesCdn = "https://static.nationallottery.ru/_next/image/dictionaries";

      function rewriteRequestUrl(value) {
        let url = value;

        if (url.startsWith(location.origin + "/api/")) {
          url = url.slice(location.origin.length);
        }

        if (url.startsWith("/api/")) {
          return "/proxy/napi/" + url.slice("/api/".length);
        }

        if (url.startsWith(apiCdn)) {
          return "/proxy/napi/" + url.slice(apiCdn.length);
        }

        if (url.startsWith(dictionariesCdn)) {
          return "/proxy/dictionaries" + url.slice(dictionariesCdn.length);
        }

        return url;
      }

      window.fetch = function localApiFetch(input, init) {
        const sourceUrl =
          typeof input === "string"
            ? input
            : input instanceof URL
              ? input.href
              : input && input.url
                ? input.url
                : String(input);

        return nativeFetch(rewriteRequestUrl(sourceUrl), init);
      };

      document.getElementById("stop-app").addEventListener("click", async () => {
        try {
          await nativeFetch("/shutdown");
        } finally {
          document.querySelector(".local-shell").innerHTML =
            "<span class=\"badge\">Приложение остановлено</span>" +
            "<h1>Можно закрыть вкладку</h1>" +
            "<p>Для нового запуска дважды щёлкните START_NLOTO_APP.cmd.</p>";
        }
      });
    })();
  </script>
  <script src="/statistics.js"></script>
</body>
</html>
